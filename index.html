<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leroboscope</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --text-dim: #aaa;
      --border: #333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      white-space: nowrap;
    }
    .dataset-input {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .dataset-input input {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .dataset-input input::placeholder { color: var(--text-dim); }
    .dataset-input button, .controls button {
      padding: 6px 14px;
      border-radius: 4px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dataset-input button:hover, .controls button:hover {
      filter: brightness(1.1);
    }
    .dataset-input button:disabled, .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    select {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    #viewport {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #viewport canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .controls .btn-group {
      display: flex;
      gap: 4px;
    }
    .controls button {
      padding: 4px 10px;
      font-size: 16px;
      line-height: 1;
      min-width: 32px;
    }
    .timeline {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timeline input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
    }
    .timeline .frame-info {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      min-width: 100px;
      text-align: right;
    }
    .speed-control {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .speed-control label {
      font-size: 12px;
      color: var(--text-dim);
    }
    .speed-control select {
      padding: 3px 6px;
      font-size: 12px;
    }
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 24px 32px;
      border-radius: 8px;
      text-align: center;
      z-index: 10;
      max-width: 500px;
    }
    #status-overlay.hidden { display: none; }
    #status-overlay .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-overlay .status-text {
      font-size: 14px;
      color: var(--text);
    }
    #status-overlay .error-text {
      font-size: 14px;
      color: var(--accent);
    }
    .dataset-meta {
      font-size: 11px;
      color: var(--text-dim);
      padding: 0 4px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Leroboscope</h1>
      <div class="dataset-input">
        <input id="dataset-id" type="text" placeholder="HF dataset ID (e.g. DanielBryars/sim_pick_place_merged_40ep)" />
        <select id="episode-select" disabled>
          <option>Episode</option>
        </select>
        <button id="load-btn" disabled>Load</button>
      </div>
      <span id="dataset-meta" class="dataset-meta"></span>
    </header>
    <div id="viewport">
      <div id="status-overlay">
        <div class="spinner"></div>
        <div class="status-text">Initializing MuJoCo...</div>
      </div>
    </div>
    <div class="controls">
      <div class="btn-group">
        <button id="prev-frame" title="Previous frame [Left arrow]">&laquo;</button>
        <button id="play-pause" title="Play/Pause [Space]">&#9654;</button>
        <button id="next-frame" title="Next frame [Right arrow]">&raquo;</button>
      </div>
      <div class="timeline">
        <input id="timeline" type="range" min="0" max="0" value="0" step="1" />
        <span id="frame-info" class="frame-info">-- / --</span>
      </div>
      <div class="speed-control">
        <label>Speed:</label>
        <select id="speed-select">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
