<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leroboscope</title>
  <!-- COOP/COEP headers via service worker (needed for SharedArrayBuffer on GitHub Pages) -->
  <script src="coi-serviceworker.min.js"></script>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --text-dim: #aaa;
      --border: #333;
      --sidebar-w: 160px;
      --right-w: 260px;
      --chart-h: 160px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* --- Header --- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 600; white-space: nowrap; }
    .dataset-input {
      display: flex;
      gap: 8px;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .dataset-input input {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .dataset-input input::placeholder { color: var(--text-dim); }
    .dataset-input button, .controls button {
      padding: 6px 14px;
      border-radius: 4px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dataset-input button:hover, .controls button:hover { filter: brightness(1.1); }
    .dataset-input button:disabled, .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    .dataset-meta { font-size: 11px; color: var(--text-dim); padding: 0 4px; white-space: nowrap; }

    /* --- Main area: sidebar + center + right --- */
    .main-area {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* --- Episode sidebar --- */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    #episode-list {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #episode-list::-webkit-scrollbar { width: 6px; }
    #episode-list::-webkit-scrollbar-track { background: transparent; }
    #episode-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .episode-item {
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.1s;
    }
    .episode-item:hover { background: var(--surface2); }
    .episode-item.active { background: var(--accent); color: white; font-weight: 500; }

    /* --- Center column: viewport + chart --- */
    .center-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    #viewport {
      flex: 1;
      position: relative;
      min-height: 0;
    }
    #viewport canvas { width: 100%; height: 100%; display: block; }

    #chart-panel {
      height: var(--chart-h);
      border-top: 1px solid var(--border);
      background: #111;
      flex-shrink: 0;
    }

    /* --- Right panel: cameras --- */
    .right-panel {
      width: var(--right-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .right-panel .sidebar-header {
      flex-shrink: 0;
    }
    #camera-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
    }
    .camera-wrapper {
      margin-bottom: 4px;
    }
    .camera-label {
      font-size: 11px;
      color: var(--text-dim);
      padding: 2px 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .camera-video {
      width: 100%;
      display: block;
      background: #000;
      border-radius: 3px;
    }

    /* --- Status overlay --- */
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 24px 32px;
      border-radius: 8px;
      text-align: center;
      z-index: 10;
      max-width: 500px;
    }
    #status-overlay.hidden { display: none; }
    #status-overlay .spinner {
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-overlay .status-text { font-size: 14px; color: var(--text); }
    #status-overlay .error-text { font-size: 14px; color: var(--accent); }

    /* --- Bottom controls --- */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .controls .btn-group { display: flex; gap: 4px; }
    .controls button { padding: 4px 10px; font-size: 16px; line-height: 1; min-width: 32px; }
    .timeline { flex: 1; display: flex; align-items: center; gap: 8px; }
    .timeline input[type="range"] { flex: 1; accent-color: var(--accent); height: 4px; }
    .timeline .frame-info {
      font-size: 12px; color: var(--text-dim);
      white-space: nowrap; min-width: 100px; text-align: right;
    }
    .ctrl-group { display: flex; align-items: center; gap: 4px; }
    .ctrl-group label { font-size: 12px; color: var(--text-dim); }
    .ctrl-group select {
      padding: 3px 6px; font-size: 12px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Leroboscope</h1>
      <div class="dataset-input">
        <select id="scene-select" title="MuJoCo scene"></select>
        <input id="dataset-id" type="text" placeholder="HF dataset ID (e.g. danbhf/sim_pick_place_2pos_200ep_v2)" />
        <button id="load-btn" disabled>Load</button>
      </div>
      <span id="dataset-meta" class="dataset-meta"></span>
    </header>
    <div class="main-area">
      <div class="sidebar">
        <div class="sidebar-header">Episodes</div>
        <div id="episode-list"></div>
      </div>
      <div class="center-col">
        <div id="viewport">
          <div id="status-overlay">
            <div class="spinner"></div>
            <div class="status-text">Initializing MuJoCo...</div>
          </div>
        </div>
        <div id="chart-panel"></div>
      </div>
      <div class="right-panel">
        <div class="sidebar-header">Cameras</div>
        <div id="camera-container"></div>
      </div>
    </div>
    <div class="controls">
      <div class="btn-group">
        <button id="prev-frame" title="Previous frame [Left arrow]">&laquo;</button>
        <button id="play-pause" title="Play/Pause [Space]">&#9654;</button>
        <button id="next-frame" title="Next frame [Right arrow]">&raquo;</button>
      </div>
      <div class="timeline">
        <input id="timeline" type="range" min="0" max="0" value="0" step="1" />
        <span id="frame-info" class="frame-info">-- / --</span>
      </div>
      <div class="ctrl-group">
        <label>Speed:</label>
        <select id="speed-select">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label>Data:</label>
        <select id="data-source-select">
          <option value="action" selected>Action</option>
          <option value="state">Obs. State</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label>Units:</label>
        <select id="units-select">
          <option value="normalized" selected>Normalized [-100,100]</option>
          <option value="degrees">Degrees (grip 0-100)</option>
          <option value="radians">Radians</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label><input id="fov-toggle" type="checkbox" checked /> FOV</label>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
